# XcodeGen project description for the macOS application (Apprentice, named after Cakewalk Apprentice).
#   brew install xcodegen
#   xcodegen generate
#   open Apprentice.xcodeproj
# The generated project is not committed; the Swift package in this directory holds the code.
name: Apprentice
options:
  bundleIdPrefix: io.github.zaskar9
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
packages:
  Apprentice:
    path: .
targets:
  Apprentice:
    type: application
    platform: macOS
    sources:
      - path: Apps/Apprentice
        excludes:
          - Info.plist
          - Apprentice.entitlements
      # The app icon: an Icon Composer bundle (Xcode 26); Xcode compiles it, with a flat fallback
      # for macOS 13 and 14. The Illustrator master next to it stays out of the build.
      - path: Resources/Apprentice.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Apprentice
        product: SequencerKit
      - package: Apprentice
        product: CoreMIDIKit
      - package: Apprentice
        product: SynthKit
    info:
      path: Apps/Apprentice/Info.plist
      properties:
        CFBundleName: Apprentice
        CFBundleDisplayName: Apprentice
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "MIT License"
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Cakewalk Work
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.zaskar9.apprentice.cakewalk-work]
          - CFBundleTypeName: Standard MIDI File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.midi-audio]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.zaskar9.apprentice.cakewalk-work
            UTTypeDescription: Cakewalk Work
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [wrk]
          - UTTypeIdentifier: io.github.zaskar9.apprentice.soundfont
            UTTypeDescription: SoundFont
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sf2]
          - UTTypeIdentifier: io.github.zaskar9.apprentice.dls
            UTTypeDescription: Downloadable Sounds
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [dls]
    entitlements:
      path: Apps/Apprentice/Apprentice.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_NAME: Apprentice
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zaskar9.apprentice
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: Apprentice
        COMBINE_HIDPI_IMAGES: true
schemes:
  Apprentice:
    build:
      targets:
        Apprentice: all
    run:
      config: Debug
